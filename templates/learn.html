{% extends "base.html" %}
{% block linkcss %}
<link rel="stylesheet" href="https://unpkg.com/mathlive/dist/mathlive-static.css" />
<style>
    /* Reset và base styles */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: linear-gradient(135deg, #1a3a28 0%, #2d5a41 50%, #1a3a28 100%);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden;
    }

    .learn-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        min-height: 100vh;
        padding: 40px 20px;
    }

    .learn-card {
        background: linear-gradient(135deg, rgba(42, 71, 56, 0.95) 0%, rgba(58, 95, 76, 0.95) 100%);
        border: 2px solid rgba(240, 228, 145, 0.5);
        backdrop-filter: blur(30px);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 0 80px rgba(240, 228, 145, 0.15), 0 20px 60px rgba(0, 0, 0, 0.4);
        width: 100%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        animation: slideUp 0.6s ease-out;
        color: #fff;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .hidden { display: none !important; }

    /* Header */
    .learn-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(240, 228, 145, 0.2);
        padding-bottom: 20px;
        margin-bottom: 10px;
    }

    .header-title { 
        text-align: center;
        flex: 1;
    }
    .header-title h1 {
        font-size: 1.8rem;
        color: #F0E491;
        font-weight: 800;
        margin-bottom: 4px;
    }
    .tagline {
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.7);
    }

    .back-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 8px 16px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
    }
    .back-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: #F0E491;
    }

    /* Form Elements */
    .form-group { margin-bottom: 20px; }
    .input-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #F0E491;
        font-size: 1rem;
    }

    .select-wrapper { 
        position: relative; 
        max-width: 200px;
    }
    .custom-select {
        width: 100%;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.3);
        border: 1.5px solid rgba(240, 228, 145, 0.3);
        border-radius: 12px;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        outline: none;
        appearance: none;
    }
    .custom-select:focus {
        border-color: #F0E491;
        box-shadow: 0 0 15px rgba(240, 228, 145, 0.2);
    }

    .math-input-container {
        background: rgba(0, 0, 0, 0.3);
        border: 1.5px solid rgba(240, 228, 145, 0.3);
        border-radius: 12px;
        padding: 4px;
        transition: all 0.3s;
    }
    .math-input-container:focus-within {
        border-color: #F0E491;
        box-shadow: 0 0 15px rgba(240, 228, 145, 0.2);
        background: rgba(0, 0, 0, 0.5);
    }

    math-field {
        width: 100%;
        background: transparent;
        color: white;
        font-size: 1.2rem;
        padding: 10px;
        --caret-color: #F0E491;
        --selection-background-color: rgba(240, 228, 145, 0.3);
        --selection-color: white;
        border: none;
        outline: none;
    }

    /* Buttons */
    .primary-btn {
        background: linear-gradient(90deg, #F0E491, #BBC863);
        color: #1a3a28;
        border: none;
        padding: 14px 32px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
        box-shadow: 0 4px 12px rgba(240, 228, 145, 0.3);
    }
    .primary-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(240, 228, 145, 0.4);
    }
    .primary-btn:disabled { 
        opacity: 0.7; 
        cursor: not-allowed; 
        transform: none !important;
        box-shadow: 0 4px 12px rgba(240, 228, 145, 0.3) !important;
    }

    .btn-continue {
        background: linear-gradient(90deg, #4caf50, #66bb6a);
        color: white;
        border: none;
        padding: 14px 32px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 30px;
        width: 100%;
        box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .btn-continue:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
    }

    /* Solution Section */
    .solution-section {
        display: flex;
        flex-direction: column;
        gap: 24px;
        animation: fadeIn 0.5s;
    }

    .section-badge {
        display: inline-block;
        background: rgba(255,255,255,0.1);
        padding: 4px 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        color: rgba(255,255,255,0.7);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .problem-display {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        border: 1px dashed rgba(255, 255, 255, 0.3);
    }
    .math-content { 
        font-size: 1.4rem; 
        color: white;
        overflow-x: auto;
    }

    /* Steps */
    .steps-list { 
        display: flex; 
        flex-direction: column; 
        gap: 16px; 
    }

    .step {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        overflow: hidden;
        transition: all 0.3s;
    }

    .step h4 {
        background: rgba(255, 255, 255, 0.05);
        color: #64b5f6;
        padding: 12px 20px;
        margin: 0;
        font-size: 1rem;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .step-content {
        padding: 20px;
        color: #e2e8f0;
        line-height: 1.6;
        font-size: 1rem;
    }

    /* QUAN TRỌNG: Fix inline math không xuống dòng */
    .step-content mjx-container {
        display: inline !important;
        margin: 0 !important;
        padding: 0 2px !important;
        vertical-align: -0.3ex !important;
    }

    .step-content .MathJax {
        display: inline !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .answer-section {
        background: rgba(76, 175, 80, 0.15);
        border: 1px solid rgba(76, 175, 80, 0.3);
        border-radius: 12px;
        padding: 20px;
        margin-top: 10px;
    }

    .answer-section h3 {
        color: #a5d6a7;
        font-size: 1.1rem;
        margin-bottom: 10px;
    }

    .answer-content {
        color: #ffffff;
        font-weight: 600;
        font-size: 1.2rem;
        text-align: center;
    }

    .answer-content mjx-container {
        display: inline !important;
        margin: 0 !important;
    }

    /* Loading */
    .loading-toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: rgba(42, 71, 56, 0.95);
        border: 1px solid rgba(240, 228, 145, 0.6);
        backdrop-filter: blur(12px);
        padding: 12px 24px;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        z-index: 9999;
        pointer-events: none;
        animation: slideInToast 0.4s;
    }

    .spinner-icon {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #F0E491;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    .loading-text { 
        color: #fff; 
        font-weight: 600;
        white-space: nowrap;
    }

    @keyframes slideInToast {
        from { opacity: 0; transform: translateY(20px) scale(0.9); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes spin { 
        to { transform: rotate(360deg); } 
    }
    @keyframes fadeIn { 
        from { opacity: 0; } 
        to { opacity: 1; } 
    }

    /* Background effect */
    body::before {
        content: '';
        position: fixed;
        top: 0; 
        left: 0; 
        right: 0; 
        bottom: 0;
        background: 
            radial-gradient(circle at 20% 50%, rgba(240, 228, 145, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(101, 140, 88, 0.1) 0%, transparent 50%),
            linear-gradient(135deg, #1a3a28 0%, #2d5a41 50%, #1a3a28 100%);
        pointer-events: none;
        z-index: -1;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .learn-container {
            padding: 20px 15px;
        }
        
        .learn-card {
            padding: 24px 16px;
        }
        
        .learn-header {
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }
        
        .header-title h1 {
            font-size: 1.4rem;
        }
        
        .back-btn {
            align-self: flex-start;
        }
        
        .loading-toast {
            bottom: 20px;
            right: 20px;
            left: 20px;
            justify-content: center;
        }
        
        .step-content {
            padding: 15px;
            font-size: 0.95rem;
        }
    }

    /* Print styles */
    @media print {
        .back-btn, .btn-continue {
            display: none;
        }
        
        .learn-card {
            box-shadow: none;
            border: 1px solid #ccc;
        }
    }
        .step-content {
        padding: 20px;
        color: #e2e8f0;
        line-height: 1.6;
        font-size: 1rem;
        word-wrap: break-word;
    }

    /* QUAN TRỌNG: Reset hoàn toàn MathJax elements */
    .step-content mjx-container {
        display: inline !important;
        margin: 0 !important;
        padding: 0 1px !important;
        line-height: 1 !important;
        vertical-align: -0.3ex !important;
        width: auto !important;
        height: auto !important;
        min-width: 0 !important;
        min-height: 0 !important;
    }

    /* Force ALL MathJax to be inline */
    mjx-container {
        display: inline !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    mjx-container[display="true"] {
        display: inline !important;
    }

    /* Fix cho các wrapper elements */
    .step-content .MathJax,
    .step-content .MathJax_Display,
    .step-content .MathJax_Preview {
        display: inline !important;
        margin: 0 !important;
        padding: 0 !important;
        text-align: left !important;
    }

    /* Đảm bảo không có float */
    .step-content mjx-container,
    .step-content .MathJax {
        float: none !important;
        clear: none !important;
    }

    /* Fix cho answer content */
    .answer-content mjx-container {
        display: inline !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* Override mọi thứ có thể */
    .step-content * {
        display: inline !important;
        white-space: normal !important;
    }

    .step-content br {
        display: none !important;
    }
    @keyframes forceInline {
    from { 
        display: block !important;
        margin: 1em 0 !important;
    }
    to { 
        display: inline !important;
        margin: 0 !important;
    }
}

mjx-container {
    animation: forceInline 0.1s forwards !important;
}
</style>
{% endblock %}

{% block content %}
<div class="learn-container">
    <div class="learn-card">
        <div class="learn-header">
            <button class="back-btn" onclick="navigateToHome();" title="Quay lại trang chủ">
                <span>❮</span> Quay lại
            </button>
            <div class="header-title">
                <h1>📖 Chế độ Học Tập</h1>
                <p class="tagline">Học chi tiết - Hiểu cặn kẽ từng bước</p>
            </div>
            <div style="width: 80px;"></div> <!-- Spacer for alignment -->
        </div>

        <div id="question_div" class="input-section">
            <div class="form-group">
                <label for="lop" class="input-label">📚 Chọn lớp kiến thức</label>
                <div class="select-wrapper">
                    <select id="lop" name="lop" class="custom-select">
                        <option value="1">Lớp 1</option>
                        <option value="2">Lớp 2</option>
                        <option value="3">Lớp 3</option>
                        <option value="4">Lớp 4</option>
                        <option value="5">Lớp 5</option>
                        <option value="6">Lớp 6</option>
                        <option value="7">Lớp 7</option>
                        <option value="8">Lớp 8</option>
                        <option value="9">Lớp 9</option>
                        <option value="10">Lớp 10</option>
                        <option value="11">Lớp 11</option>
                        <option value="12">Lớp 12</option>
                        <option value="Không giới hạn">Không giới hạn</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="question" class="input-label">✍️ Nhập bài toán cần giải</label>
                <div class="math-input-container">
                    <math-field 
                        virtual-keyboard-mode="onfocus" 
                        smart-fence 
                        id="question" 
                        name="question"
                        class="custom-math-field"
                        placeholder="Nhập biểu thức (ví dụ: x^2 - 4 = 0)..."
                    ></math-field>
                </div>
            </div>

            <div class="action-area">
                <button type="button" onclick="submitMathQuestion()" id="submitBtn" class="primary-btn">
                    🎓 Gửi bài toán
                </button>
            </div>
        </div>

        <div id="hiddenSection" class="hidden solution-section">
            <div class="problem-display">
                <div class="section-badge">Đề bài</div>
                <div id="problem" class="math-content"></div>
            </div>

            <div class="steps-container">
                <div class="section-badge">Lời giải chi tiết</div>
                <div id="solve" class="steps-list">
                    <!-- Steps will be inserted here -->
                </div>
            </div>
            
            <div id="action-footer" class="footer-actions">
                <!-- Continue button will be inserted here -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block linkjs %}
    <script src="{{ url_for('static', filename='js/learn.js') }}"></script>
{% endblock %}
