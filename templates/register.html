{% extends "base.html" %}
{% block linkcss %}
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="glow-wrapper">
        <div class="auth-card">
            <a href="#" class="back-link" onclick="navigateToWelcome(); return false;">
                ← Quay lại trang chủ
            </a>
            
            <div class="card-header">
                <h1>Đăng ký</h1>
                <p>Tạo tài khoản MindX mới</p>
            </div>
            
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="register-username">Tên đăng nhập</label>
                    <input type="text" id="register-username" class="form-input" placeholder="Chọn tên đăng nhập" required>
                </div>
                
                <div class="form-group">
                    <label for="register-password">Mật khẩu</label>
                    <div class="password-wrapper">
                        <input type="password" id="register-password" class="form-input" placeholder="Tối thiểu 8 ký tự" required minlength="8">
                        <button type="button" class="toggle-password" onclick="togglePassword('register-password')">👁️</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="register-confirm-password">Xác nhận mật khẩu</label>
                    <div class="password-wrapper">
                        <input type="password" id="register-confirm-password" class="form-input" placeholder="Nhập lại mật khẩu" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('register-confirm-password')">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="primary-button">Tạo tài khoản</button>
            </form>
            
            <div class="divider">hoặc</div>
            
            <div class="footer-text">
                Đã có tài khoản? <a href="#" onclick="navigateToLogin(); return false;">Đăng nhập</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block linkjs %}
        <script src="{{ url_for('static', filename='auth.js') }}"></script>
{% endblock %}
