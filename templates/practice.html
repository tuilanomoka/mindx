{% extends "base.html" %}
{% block linkcss %}
<link rel="stylesheet" href="https://unpkg.com/mathlive/dist/mathlive-static.css" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/practice.css') }}">
{% endblock %}

{% block content %}
<div class="practice-container">
    <div class="practice-card">
        <div class="practice-header">
            <button class="back-btn" onclick="navigateToHome();" title="Quay lại trang chủ">
                <span>❮</span> Quay lại
            </button>
            <div class="header-title">
                <h1>🎯 Chế độ Rèn Luyện</h1>
                <p class="tagline">Thử thách tư duy - Tự mình giải quyết</p>
            </div>
            <div class="header-spacer"></div>
        </div>

        <div id="question_div" class="input-section">
            <div class="form-group">
                <label for="lop" class="input-label">📚 Chọn lớp kiến thức</label>
                <div class="select-wrapper">
                    <select id="lop" name="lop" class="custom-select">
                        <option value="1">Lớp 1</option>
                        <option value="2">Lớp 2</option>
                        <option value="3">Lớp 3</option>
                        <option value="4">Lớp 4</option>
                        <option value="5">Lớp 5</option>
                        <option value="6">Lớp 6</option>
                        <option value="7">Lớp 7</option>
                        <option value="8">Lớp 8</option>
                        <option value="9">Lớp 9</option>
                        <option value="10">Lớp 10</option>
                        <option value="11">Lớp 11</option>
                        <option value="12">Lớp 12</option>
			<option value="Không giới hạn">Không giới hạn</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="question" class="input-label">✍️ Nhập đề bài toán</label>
                <div class="math-input-container">
                    <math-field 
                        virtual-keyboard-mode="onfocus" 
                        smart-fence 
                        id="question" 
                        name="question"
                        class="custom-math-field"
                        placeholder="Nhập biểu thức toán học (ví dụ: 2x + 5 = 10)..."
                    ></math-field>
                </div>
            </div>

            <div class="action-area">
                <button type="button" onclick="submitMathQuestion()" id="submitBtn" class="primary-btn">
                    🚀 Bắt đầu
                </button>
            </div>
        </div>

        <div id="hiddenSection" class="hidden solving-section">
            
            <div class="score-board">
                <span class="score-icon">⭐</span>
                <p id="grade">Điểm hiện tại: 100</p>
            </div>

            <div class="problem-display">
                <div class="section-badge">Đề bài</div>
                <div id="problem" class="math-content"></div>
            </div>

            <div class="steps-container">
                <div class="section-badge">Hướng dẫn giải (Click để mở gợi ý - Sẽ bị trừ điểm)</div>
                <div id="solve" class="steps-list">
                    </div>
            </div>

            <div class="answer-input-section">
                <label for="user-answer" class="input-label">✨ Câu trả lời của bạn</label>
                <div class="math-input-container answer-field-wrapper">
                    <math-field 
                        virtual-keyboard-mode="onfocus" 
                        smart-fence 
                        id="user-answer" 
                        class="custom-math-field"
                        placeholder="Nhập đáp án cuối cùng..."
                    ></math-field>
                </div>
                <button type="button" onclick="submitAnswer()" class="submit-answer-btn">
                    Gửi câu trả lời
                </button>
            </div>

            <div id="answer-result-container"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block linkjs %}
    <script src="https://unpkg.com/mathlive/dist/mathlive.min.js"></script>
    <script src="{{ url_for('static', filename='js/practice.js') }}"></script>
{% endblock %}
