<!DOCTYPE html>
<html>

<head>
    <title>MindX</title>
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer base {
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            html, body {
                width: 100%;
                height: 100%;
                color: #e2e8f0;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                overflow: hidden;
            }
        }
        
        @layer components {
            .bg-animation {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: 
                    linear-gradient(180deg, rgba(30, 41, 59, 0.3) 0%, transparent 50%, rgba(30, 41, 59, 0.2) 100%),
                    linear-gradient(90deg, transparent 0%, rgba(15, 23, 42, 0.5) 50%, transparent 100%);
                animation: subtle-shift 15s ease-in-out infinite;
                pointer-events: none;
                z-index: 0;
            }
            
            .page {
                display: none;
                width: 100%;
                height: 100%;
                position: relative;
                z-index: 10;
            }
            
            .page.active {
                display: flex;
            }
            
            .glow-wrapper {
                animation: glow-pulse 4s ease-in-out infinite;
            }
            
            .card-header {
                margin-bottom: 24px;
            }
        }
        
        @layer utilities {
            @keyframes subtle-shift {
                0%, 100% { opacity: 0.8; }
                50% { opacity: 1; }
            }
            
            @keyframes glow-pulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.02); }
            }
            
            @keyframes slideUp {
                from {
                    opacity: 0;
                    transform: translateY(40px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }
    </style>
    {% block linkcss %}
    {% endblock %}
</head>

<body class="bg-slate-900">
    <div class="bg-animation"></div>

    {% block content %}
    {% endblock %}

    {% block linkjs %}
    {% endblock %}
    <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                tags: 'ams'
            },
            chtml: {
                displayAlign: 'center',
                displayIndent: '0em',
                linebreaks: { automatic: true, width: "container" }
            },
            svg: {
                fontCache: 'global',
                linebreaks: { width: "container" }
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
        </script>
    <script src="https://unpkg.com/mathlive/dist/mathlive.min.js"></script>
</body>

</html>
