{% extends "base.html" %}
{% block linkcss %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/inventory.css') }}">
{% endblock %}
{% block content %}
<div class="inventory-container">
    <div class="inventory-header">
        <h1>Kho Đồ Của Bạn</h1>
        <div class="user-stats">
            <div class="stat">
                <span>Tổng điểm: </span>
                <strong id="total-points">0</strong>
            </div>
            <div class="stat">
                <span>Điểm hiện tại: </span>
                <strong id="current-points">0</strong>
            </div>
        </div>
    </div>
    
    <div class="inventory-grid" id="inventory-grid">
        <!-- Inventory items sẽ được load bằng JavaScript -->
    </div>
    
    <div class="empty-inventory" id="empty-inventory" style="display: none;">
        <p>Kho đồ của bạn đang trống!</p>
        <a href="{{ url_for('shop_page') }}" class="btn-primary">Đến cửa hàng</a>
    </div>
    
    <div class="loading" id="loading">Đang tải...</div>
</div>
{% endblock %}
{% block linkjs %}
<script src="{{ url_for('static', filename='js/inventory.js') }}"></script>
{% endblock %}
